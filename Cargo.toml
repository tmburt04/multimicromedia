[package]
name = "mmm"
version = "0.2.0"
edition = "2021"
description = "multimicromedia — client-side media compression via WASM"
license = "MIT"
repository = "https://github.com/tmburt04/multimicromedia"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "DomStringList",
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
] }

# Image processing
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "tiff",
    "ico",
] }
png = "0.17"
color_quant = "1.1"
gif = "0.13"

# SVG processing
roxmltree = "0.20"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
base64 = "0.22"
crc32fast = "1.4"
thiserror = "2"
console_error_panic_hook = "0.1"
regex = "1"

# One-shot completion channels for IndexedDB
futures-channel = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.dev]
opt-level = 1
